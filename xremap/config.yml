modmap:
  - name: Global
    remap:
      KEY_CAPSLOCK:
        held: KEY_CAPSLOCK
        alone: KEY_ESC
        free_hold: true
  - name: Alt <-> Super
    remap:
      KEY_LEFTALT: KEY_LEFTMETA
      KEY_RIGHTALT: KEY_RIGHTMETA
      KEY_LEFTMETA: KEY_LEFTALT
      KEY_RIGHTMETA: KEY_RIGHTALT
    device:
      only: ["AT Translated Set 2"]
  - name: Firefox Alt <-> Super
    application:
      only: [firefox]
    remap:
      KEY_LEFTALT: KEY_LEFTMETA
      KEY_LEFTMETA: KEY_LEFTALT
      KEY_RIGHTALT: KEY_RIGHTMETA
      KEY_RIGHTMETA: KEY_RIGHTALT

keymap:
  - name: Accute Accent
    remap:
      KEY_RIGHTALT-KEY_E: [KEY_COMPOSE, KEY_APOSTROPHE]
  - name: Grave Accent
    remap:
      KEY_RIGHTALT-KEY_GRAVE: [KEY_COMPOSE, KEY_GRAVE]
  - name: Circumflex Accent
    remap:
      KEY_LEFTALT-KEY_I: [KEY_COMPOSE, KEY_LEFTSHIFT-KEY_6]
  - name: Cedille
    remap:
      KEY_RIGHTALT-KEY_C: [KEY_COMPOSE, KEY_COMMA, KEY_C]
  # https://en.wikipedia.org/wiki/Compose_key
  # https://www.yogicstudies.com/blog/how-to-type-transliterated-sanskrit-with-diacritics-in-mac-osxGo
  - name: Sanskrit IAST Diacritics
    remap:
      # ā/Ā, ī/Ī, ū/Ū: option+a, then a/A/i/I/u/U.
      KEY_RIGHTALT-KEY_A: [KEY_COMPOSE, KEY_MINUS]
      # ṛ/Ṛ, ḷ/Ḷ, ṃ/Ṃ, ḥ/Ḥ, ṭ/Ṭ, ḍ/Ḍ, ṇ/Ṇ, ṣ/Ṣ: option+x, then letter.
      KEY_RIGHTALT-KEY_X: [KEY_COMPOSE, KEY_LEFTSHIFT-KEY_1]
      # ṅ/Ṅ: option+w, then n/N.
      KEY_RIGHTALT-KEY_W: [KEY_COMPOSE, KEY_DOT]
      # ñ/Ñ: option+n, then n/N.
      KEY_LEFTALT-KEY_N: [KEY_COMPOSE, KEY_RIGHTSHIFT-KEY_GRAVE]

